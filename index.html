<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opus Clip Clone - Tester</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 400px; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #bb86fc; color: #000; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #9965f4; }
        #status { margin-top: 20px; font-size: 14px; color: #03dac6; }
        #result { margin-top: 20px; text-align: left; background: #2c2c2c; padding: 10px; border-radius: 5px; display: none; font-size: 13px; overflow-wrap: break-word; }
    </style>
</head>
<body>

    <div class="container">
        <h2>✂️ Auto-Clipper AI</h2>
        <p>Unggah video untuk mencari highlight viral.</p>
        
        <input type="file" id="videoFile" accept="video/mp4,video/x-m4v,video/*">
        <button onclick="uploadVideo()">Potong Video Sekarang</button>

        <div id="status"></div>
        <pre id="result"></pre>
    </div>

    <script>
        async function uploadVideo() {
            const fileInput = document.getElementById('videoFile');
            const statusDiv = document.getElementById('status');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert("Pilih video dulu, ya!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("video", file);

            // Ganti URL ini dengan URL Render milikmu!
            const apiUrl = "https://clipper-project-track8.onrender.com/api/v1/generate-clip";

            statusDiv.innerText = "⏳ Sedang mengunggah dan meminta AI menganalisis... (Bisa memakan waktu beberapa menit)";
            resultDiv.style.display = "none";
            document.querySelector('button').disabled = true;

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerText = "✅ Selesai!";
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                    resultDiv.style.display = "block";
                } else {
                    statusDiv.innerText = "❌ Terjadi kesalahan.";
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                    resultDiv.style.display = "block";
                }
            } catch (error) {
                statusDiv.innerText = "❌ Gagal terhubung ke server.";
                console.error(error);
            } finally {
                document.querySelector('button').disabled = false;
            }
        }
    </script>
</body>
</html>
